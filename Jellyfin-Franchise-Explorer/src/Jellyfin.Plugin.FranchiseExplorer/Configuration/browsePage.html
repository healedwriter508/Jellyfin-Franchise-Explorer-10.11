<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Franchise Explorer · Jellyfin</title>
<style>
:root{color-scheme:dark;--bg:#121212;--surface:#202020;--line:#3e3e3e;--text:#f8f8f8;--muted:#c3c3c3;--accent:#00a4dc;--radius:14px;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html{min-width:0;overflow-x:hidden;background:var(--bg)}
body{margin:0;min-width:0;overflow-x:hidden;color:var(--text);background:var(--bg);font-size:16px}
a{color:inherit;text-decoration:none}button,input,select{font:inherit}
button{cursor:pointer}button:disabled{opacity:.4;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #52c5f0;outline-offset:3px}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#141414ee;backdrop-filter:blur(15px);border-bottom:1px solid #3d3d3d;padding:10px clamp(14px,3.4vw,46px);min-height:72px;max-width:100vw}
.brand{display:flex;align-items:center;gap:12px;min-width:0;min-height:48px;padding:7px 10px;margin:-7px -10px;border-radius:10px;cursor:pointer}
.brand:hover{background:#33333388}
.brand:focus-visible{outline:3px solid #52c5f0;outline-offset:2px}
.brand-mark{width:37px;height:37px;border-radius:12px;display:grid;place-items:center;background:#00a4dc;color:#fff;font-size:21px;font-weight:800;flex-shrink:0}
.brand-title{font-size:clamp(1rem,1.8vw,1.26rem);font-weight:750;letter-spacing:-.025em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-sub{font-size:.71rem;letter-spacing:.07em;color:#a6a6a6;text-transform:uppercase}
.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid #636363;border-radius:9px;background:#303030;color:#f8f8f8;padding:10px 13px;min-height:45px;font-weight:650;line-height:1.15}
.btn:hover{background:#484848}
.btn-primary{background:#00a4dc;border-color:#00a4dc;color:#fff}
.btn-primary:hover{background:#00a4dc}
.btn-lite{background:transparent;border-color:#5c5c5c}
main{width:min(100%,1540px);margin:0 auto;padding:clamp(12px,2.6vw,38px);min-width:0}
.notice{border-left:4px solid #e3b54b;background:#30291b;padding:12px 16px;border-radius:9px;color:#f2dcac;font-size:.86rem;line-height:1.5;margin-bottom:18px}
.crumbs{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-height:44px;margin:4px 0 15px;font-size:.94rem}
.crumbs button{background:none;border:0;padding:9px 4px;color:#cacaca;border-radius:5px;min-height:42px}
.crumbs button:hover{color:#fff}
.crumbs .current{color:#fff;font-weight:720}
.hero{position:relative;border:1px solid var(--line);background:linear-gradient(115deg,#323232 4%,#202020 68%,#191919);border-radius:18px;overflow:hidden;min-height:220px;display:flex;align-items:flex-end;margin-bottom:22px}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#171717f5,#17171760 76%);z-index:1}
.hero-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.78}
.hero-inner{position:relative;z-index:2;padding:clamp(20px,3vw,35px);width:100%;display:flex;align-items:center;gap:22px;min-width:0}
.hero-poster{flex:0 0 clamp(72px,11vw,128px);height:clamp(106px,16vw,190px);border:1px solid #7f7f7f70;border-radius:9px;overflow:hidden;background:#282828;display:grid;place-items:center}
.hero-poster img{width:100%;height:100%;object-fit:contain}
.hero-info{min-width:0;max-width:920px}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:#52c5f0;font-weight:760}
h1{font-size:clamp(1.65rem,3.6vw,3.6rem);line-height:1.13;margin:9px 0 8px;letter-spacing:-.03em;overflow-wrap:anywhere}
.hero p{color:#e8e8e8;line-height:1.5;margin:8px 0;max-width:900px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.counter{color:#dddddd;font-size:.86rem}
.tools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:15px 0 20px}
.tools-left{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.tools h2{font-size:1.35rem;margin:0 12px 0 0}
.field{background:#202020;color:#fff;border:1px solid #727272;border-radius:9px;padding:12px 14px;min-height:47px;min-width:0}
.search{width:min(390px,100%)}
.field::placeholder{color:#b3b3b3}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,172px),1fr));gap:clamp(14px,2vw,24px);align-items:start}
.tile{display:flex;flex-direction:column;align-items:stretch;gap:9px;min-width:0;border:0;background:transparent;color:var(--text);text-align:left;padding:0;border-radius:11px}
.tile:hover .cover,.tile:focus-visible .cover{border-color:#00a4dc;transform:translateY(-2px);box-shadow:0 8px 25px #0006}
.cover{position:relative;aspect-ratio:2/3;border:1px solid #4c4c4c;border-radius:11px;background:linear-gradient(142deg,#373737,#1e1e1e 60%,#404040);overflow:hidden;display:grid;place-items:center;transition:transform .18s,box-shadow .18s,border-color .18s}
.cover img{width:100%;height:100%;object-fit:cover}
.cover .fallback{display:grid;place-items:center;gap:8px;text-align:center;color:#d0d0d0;padding:15px;word-break:break-word}
.cover .fallback-icon{font-size:2.6rem;line-height:1}
.cover .tag{position:absolute;top:9px;right:9px;border-radius:30px;padding:5px 8px;background:#0d0d0dc9;color:#fbfbfb;font-size:.74rem;font-weight:700;max-width:85%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile strong{display:block;font-size:.94rem;line-height:1.3;overflow-wrap:anywhere}
.tile small{display:block;font-size:.77rem;line-height:1.3;color:var(--muted)}
.section{margin-bottom:30px}
.section h2{font-size:1.35rem;margin:0 0 18px}
.section-header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;margin-bottom:16px}
.section-header h2{margin:0}
.listview{grid-template-columns:1fr!important;gap:9px}
.listview .tile{flex-direction:row;align-items:center;padding:9px;border:1px solid var(--line);background:var(--surface);border-radius:10px;gap:16px}
.listview .cover{width:74px;min-width:74px;aspect-ratio:2/3}
.listview .cover .fallback-icon{font-size:1.2rem}
.listview .tile strong{font-size:1rem}
.empty{padding:35px 15px;border:1px dashed #606060;border-radius:14px;text-align:center;color:var(--muted);line-height:1.5}
.status{margin:10px 0 22px;color:#c6c6c6;font-size:.91rem}
.footer{text-align:center;color:#9c9c9c;font-size:.79rem;margin:40px 0 15px;line-height:1.55}
.hidden{display:none!important}
@media(max-width:760px){.top{min-height:64px;padding:9px 13px}.brand-sub{display:none}.actions .desktop-word{display:none}.btn{min-height:46px}.hero{min-height:190px}.hero-inner{gap:13px}.hero-poster{flex-basis:76px;height:112px}.hero p{-webkit-line-clamp:2;font-size:.84rem}.gallery{grid-template-columns:repeat(auto-fill,minmax(min(100%,125px),1fr));gap:16px}.cover .tag{font-size:.65rem;padding:4px 6px}}
@media(max-width:420px){.brand-title{max-width:140px}.actions{gap:5px}.actions .btn{padding:9px 10px}.hero-inner{padding:14px}.hero-poster{flex-basis:65px;height:99px}.hero h1{font-size:1.6rem}.hero .counter{font-size:.78rem}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.tools-left,.search{width:100%}.section-header{align-items:flex-start}}
@media(min-width:1600px){.gallery{grid-template-columns:repeat(auto-fill,minmax(195px,1fr))}.tile strong{font-size:1.03rem}}
@media(pointer:coarse){.btn,.crumbs button,.tile{touch-action:manipulation}.tile{min-height:46px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}

/* v0.7.4.1 horizontal shelves; scroll-snapping works on TV, laptop, and touch. */
.rows-container{display:grid;gap:24px;min-width:0;margin:6px 0 28px}
.shelf{min-width:0;max-width:100%;overflow:hidden}
.shelf-header{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:0 0 12px}
.shelf-header h2{margin:0;font-size:clamp(1.08rem,1.7vw,1.4rem);overflow-wrap:anywhere}
.shelf-tools{display:flex;gap:6px;flex:none;align-items:center}
.shelf-count{font-size:.79rem;color:var(--muted);margin-right:6px}
.shelf-arrow{border:1px solid #5e5e5e;background:#2f2f2f;border-radius:8px;min-width:43px;min-height:43px;color:#f7f7f7;font-size:1.25rem}
.shelf-arrow:hover{background:#4a4a4a}
.shelf-track{display:flex;align-items:stretch;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-color:#5b5b5b #1a1a1a;scrollbar-width:thin;gap:clamp(11px,1.3vw,18px);padding:3px 1px 14px;min-width:0}
.shelf-track .tile{scroll-snap-align:start;flex:0 0 clamp(125px,13.5vw,188px);max-width:50vw}
.shelf-track .cover{width:100%}
.shelf-empty{border:1px dashed #5a5a5a;border-radius:11px;padding:17px;color:var(--muted);font-size:.89rem}
.shelf-list .shelf-track{flex-direction:column;overflow-x:hidden;scroll-snap-type:none;gap:7px}
.shelf-list .tile{flex:0 0 auto;max-width:100%;flex-direction:row;align-items:center;padding:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px}
.shelf-list .cover{flex:none;width:70px;aspect-ratio:2/3}
.shelf-list .shelf-arrow{display:none}
@media(max-width:650px){.rows-container{gap:20px}.shelf-track .tile{flex-basis:clamp(112px,36vw,160px)}.shelf-track{gap:12px}.shelf-arrow{min-height:44px;min-width:44px}}
@media(max-width:430px){.shelf-count{display:none}.shelf-track .tile{flex-basis:clamp(114px,41vw,145px)}.shelf-arrow{min-width:40px}.shelf-header h2{font-size:1.12rem}}

/* Timeline-specific completion badge and progress, never derived from a global played flag. */
.cover .timeline-watched-badge {
  position:absolute;left:0;right:0;top:45%;z-index:3;display:block;
  padding:9px 2px;text-align:center;background:rgba(0,0,0,.82);
  color:#d0d0d0;font-size:clamp(12px,1.4vw,19px);font-weight:800;
  text-shadow:0 1px 2px #000;
}
.cover .timeline-watched-badge[hidden]{display:none}

/* v0.8 chronological controls: responsive, touch and remote accessible. */
.timeline-shelf-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-4px 0 16px}
.timeline-card-caption{font-size:.73rem;color:#52c5f0;margin-top:1px}
.tile>.timeline-progress-track{height:5px;margin-top:-3px}
.timeline-mini-progress{min-width:145px;flex:1;color:var(--muted);font-size:.84rem}
.timeline-progress-track{height:7px;background:#444444;border-radius:999px;overflow:hidden;margin-top:6px;max-width:100%}
.timeline-progress-fill{height:100%;background:#00a4dc;border-radius:999px;transition:width .2s}
.timeline-dialog-mask{position:fixed;inset:0;z-index:200;background:#070707da;display:grid;place-items:center;padding:12px;overscroll-behavior:contain}
.timeline-dialog{width:min(920px,100%);max-height:min(92dvh,900px);min-width:0;overflow-y:auto;background:#212121;color:#f6f6f6;border:1px solid #727272;border-radius:16px;padding:clamp(13px,2vw,26px);box-shadow:0 22px 70px #000b}
.timeline-dialog-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.timeline-dialog-header h2{margin:5px 0;font-size:clamp(1.2rem,3vw,1.8rem)}
.timeline-feedback{color:#e7c485;font-size:.91rem;line-height:1.45;margin:12px 0}
.timeline-chooser{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:15px 0}
.timeline-watch-choice{display:flex;align-items:center;gap:9px;flex-wrap:wrap;width:100%;padding:12px;border:1px solid #6a6a6a;border-radius:10px;background:#232323;box-sizing:border-box}
.timeline-watch-choice[hidden]{display:none!important}
.timeline-watch-choice p{width:100%;margin:0 0 5px;font-weight:600;line-height:1.45}
.timeline-device{max-width:100%;min-width:min(100%,230px)}
.timeline-entry-list{display:grid;gap:8px;max-width:100%;min-width:0}
.timeline-entry{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#2c2c2c;border:1px solid #555555;border-radius:10px;padding:12px}
.timeline-entry-text{display:grid;gap:6px;min-width:0;flex:1;overflow-wrap:anywhere}
.timeline-entry-text strong{font-size:.94rem}
.timeline-entry-text small{color:#c4c4c4;font-size:.76rem}
.timeline-entry-actions{display:flex;gap:6px;flex-wrap:wrap}
.timeline-entry-actions .btn{min-height:42px;font-size:.82rem;padding:8px}
.timeline-complete{border-color:#0086b3}
@media(max-width:650px){.timeline-entry{align-items:stretch;flex-direction:column}.timeline-entry-actions{display:grid;grid-template-columns:1fr 1fr}.timeline-chooser .btn{flex:1}.timeline-dialog{max-height:96dvh}}

/* v0.8.1: distinct info control, deterministic card order and player preferences. */
.tile-info{position:absolute;top:7px;right:7px;z-index:4;display:grid;place-items:center;
  width:39px;height:39px;border:1px solid #b2b2b2;border-radius:50%;background:#1a1a1add;
  color:#fff;font-size:23px;font-weight:700;line-height:1;box-shadow:0 2px 8px #0008}
.tile-info:hover,.tile-info:focus-visible{background:#0086b3;outline:2px solid #52c5f0}
.cover .tag{left:8px;right:auto;max-width:calc(100% - 55px)}
.playback-settings{display:flex;align-items:center;gap:10px 15px;flex-wrap:wrap;
  padding:10px 14px;border:1px solid #444444;border-radius:10px;margin-bottom:16px;background:#202020}
.subtitle-option{display:flex;align-items:center;gap:9px;font-weight:650;cursor:pointer;font-size:.91rem}
.subtitle-option input{height:21px;width:21px;accent-color:#00a4dc}
.subtitle-note{font-size:.78rem;color:#c0c0c0;line-height:1.45}
@media(max-width:650px){.tile-info{width:43px;height:43px}}

/* v0.8.3 mobile polish: fewer oversized controls, no horizontal cropping. */
@media(max-width:650px){
  .notice{font-size:.82rem;padding:10px 12px;margin-bottom:12px}
  .hero{min-height:160px;margin-bottom:14px}
  .hero-inner{padding:14px;gap:12px}
  .hero-poster{flex-basis:66px;height:96px}
  .hero h1{font-size:clamp(1.35rem,6vw,1.8rem);line-height:1.15}
  .hero p{font-size:.82rem;line-height:1.35;-webkit-line-clamp:2}
  .playback-settings{padding:10px 12px}
  .subtitle-note{font-size:.75rem}
  .timeline-dialog{width:calc(100vw - 18px);max-height:92dvh;}
}
/* v0.8.9.16 Jellyfin-native theme layer: matches Jellyfin Web's default dark
   theme (Noto Sans, #101010 canvas, #00a4dc accent, 0.2em corners) so the
   standalone browser feels like part of Jellyfin rather than a separate app. */
:root{--bg:#101010;--surface:#1c1c1c;--surface-2:#292929;--raised:#303030;--raised-hover:#3a3a3a;--line:rgba(255,255,255,.1);
  --text:rgba(255,255,255,.87);--muted:rgba(255,255,255,.6);--accent:#00a4dc;--accent-hover:#0cb0e8;--radius:.2em;
  font-family:"Noto Sans","Noto Sans HK","Noto Sans JP","Noto Sans KR","Noto Sans SC","Noto Sans TC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{font-size:16px;-webkit-font-smoothing:antialiased}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,.brand:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{background:rgba(16,16,16,.92);border-bottom:0;box-shadow:0 1px 0 rgba(255,255,255,.05);min-height:64px}
.brand{border-radius:var(--radius)}
.brand:hover{background:rgba(255,255,255,.08)}
.brand-mark{border-radius:8px;background:linear-gradient(135deg,#aa5cc3 0%,#00a4dc 100%);color:#fff;font-size:19px}
.brand-title{font-weight:500;letter-spacing:0}
.btn{border:0;border-radius:var(--radius);background:var(--raised);color:var(--text);font-weight:500;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:.45em}
.btn:hover{background:var(--raised-hover)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-lite{background:transparent;color:var(--text)}
.btn-lite:hover{background:rgba(255,255,255,.1)}
.icon{width:1.35em;height:1.35em;flex:none;fill:currentColor}
.field{background:var(--surface-2);border:1px solid var(--surface-2);border-radius:var(--radius);color:var(--text)}
.field:focus{border-color:var(--accent);outline:0}
.notice{border-radius:var(--radius)}
.crumbs button{color:var(--muted);border-radius:var(--radius)}
.crumbs button:hover{color:#fff;background:rgba(255,255,255,.06)}
.hero{border:0;border-radius:.3em;background:linear-gradient(115deg,#262626 4%,#1a1a1a 68%,#141414)}
.hero::before{background:linear-gradient(0deg,rgba(16,16,16,.96),rgba(16,16,16,.35) 76%)}
.hero-poster{border:0;border-radius:var(--radius);box-shadow:0 4px 18px rgba(0,0,0,.5)}
.eyebrow{color:var(--accent);letter-spacing:.1em;font-weight:600}
h1{font-weight:500;letter-spacing:-.01em}
.tools h2,.section h2,.shelf-header h2{font-weight:500}
.tile{border-radius:var(--radius);gap:6px}
.tile strong,.tile small{text-align:center}
.tile strong{font-weight:500}
.cover{border:0;border-radius:var(--radius);background:linear-gradient(142deg,#262626,#1a1a1a 60%,#222);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.tile:hover .cover,.tile:focus-visible .cover{transform:none;border-color:transparent;box-shadow:0 0 0 3px var(--accent)}
.tile:focus-visible{outline:0}
.cover .fallback{color:var(--muted)}
.cover .tag{background:rgba(0,0,0,.7);border-radius:var(--radius)}
.listview .tile,.shelf-list .tile{border:0;background:var(--surface);border-radius:var(--radius)}
.listview .tile strong,.listview .tile small,.shelf-list .tile strong,.shelf-list .tile small{text-align:left}
.empty,.shelf-empty{border-color:rgba(255,255,255,.15);border-radius:var(--radius)}
.shelf-arrow{border:0;border-radius:50%;background:transparent;color:var(--text);display:inline-grid;place-items:center}
.shelf-arrow:hover{background:rgba(255,255,255,.1)}
.shelf-track{scrollbar-color:#3a3a3a transparent}
.tile-info{border:0;background:rgba(0,0,0,.6);box-shadow:none}
.tile-info:hover,.tile-info:focus-visible{background:var(--accent);outline:0}
.playback-settings{border:0;background:var(--surface);border-radius:var(--radius)}
.timeline-progress-track{background:rgba(255,255,255,.15)}
.timeline-card-caption{color:var(--muted)}
.cover .timeline-watched-badge{color:#fff;background:rgba(0,164,220,.88)}
.timeline-dialog-mask{background:rgba(0,0,0,.7)}
.timeline-dialog{background:#202020;border:0;border-radius:.3em;box-shadow:0 0 30px rgba(0,0,0,.6)}
.timeline-feedback{color:#e7c485}
.timeline-watch-choice{border:0;background:var(--surface-2);border-radius:var(--radius)}
.timeline-entry{background:var(--surface-2);border:0;border-radius:var(--radius)}
.timeline-complete{box-shadow:inset 3px 0 0 var(--accent)}
.footer{color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <a id="brand-home" class="brand" href="/FranchiseExplorer/Browse" title="Return to Your franchises" aria-label="Franchise Explorer — return to Your franchises"><span class="brand-mark" aria-hidden="true">F</span><span id="brand-title" class="brand-title">Franchise Explorer</span></a>

<script src="TimelineClient.js"></script>
<script>
'use strict';
(() => {
  const $ = id => document.getElementById(id);
  const prefix = location.pathname.split('/FranchiseExplorer/')[0].replace(/\/$/,'');
  const serverPath = path => prefix + (path.startsWith('/') ? path : '/' + path);
  $('return-jellyfin').href = serverPath('/web/index.html');
  $('fe-config-settings').href = serverPath('/web/index.html#/configurationpage?name=Franchise%20Explorer');
  $('brand-home').href = serverPath('/FranchiseExplorer/Browse');
  let token = '', userId = '', serverId = '', catalog = {nodes:[],links:[],rows:[]}, current = '', view = 'grid', shownCards = [], renderSerial = 0, timeline = null;
  const itemCache = new Map(), blobCache = new Map();
  const imageKeys = {Primary:'primaryUrl',Backdrop:'backdropUrl',Logo:'logoUrl',Thumb:'thumbUrl',Banner:'bannerUrl'};
  const text = (el, value) => {el.textContent = value == null ? '' : String(value);return el;};
  const safeGuid = v => /^[a-f\d]{32}$|^[a-f\d]{8}(?:-[a-f\d]{4}){3}-[a-f\d]{12}$/i.test(String(v || ''));
  const status = message => text($('status'),message);
  const authHeaders = () => ({Authorization:'MediaBrowser Token="'+token+'"'});
  function serverMatch(s){return ['ManualAddress','LocalAddress','RemoteAddress','LastConnectionAddress'].some(k=>{
    try{return s[k] && new URL(s[k]).origin === location.origin;}catch(_){return false;}
  });}
  async function session(){
    // Jellyfin Web stores its own login information on this same origin.
    // No token is sent through a URL, query string, or third-party service.
    let servers=[];
    try{servers=JSON.parse(localStorage.getItem('jellyfin_credentials')||'{}').Servers||[];}catch(_){/* No session */}
    let id='';try{const r=await fetch(serverPath('/System/Info/Public'));if(r.ok)id=(await r.json()).Id||'';}catch(_){/* optional */}
    const matches=servers.filter(s=>s.AccessToken&&s.UserId);
    const chosen=matches.find(s=>id&&s.Id===id)||matches.find(serverMatch)||(matches.length===1?matches[0]:null);
    if(!chosen)return false;
    token=chosen.AccessToken;userId=chosen.UserId;serverId=chosen.Id||id;
    return true;
  }
  async function api(path){
    const r=await fetch(serverPath(path),{headers:authHeaders(),cache:'no-store'});
    if(!r.ok){const error=new Error('Jellyfin request failed ('+r.status+')');error.status=r.status;throw error;}
    return await r.json();
  }
  async function getItem(id){
    if(!safeGuid(id))return null;
    id=String(id).toLowerCase();
    if(!itemCache.has(id)){
      const promise=api('/Items/'+encodeURIComponent(id)+'?userId='+encodeURIComponent(userId))
        .then(x=>(x&&safeGuid(x.Id))?x:null).catch(()=>null);
      itemCache.set(id,promise);
    }
    return await itemCache.get(id);
  }
  async function secureImage(path){
    if(!path)return '';
    // Uploaded artwork and Jellyfin-generated artwork use authenticated fetch,
    // so an authentication token never appears in an image URL.
    if(/^https:\/\//i.test(path) || /^http:\/\//i.test(path)){
      try{const u=new URL(path);if(u.origin !== location.origin)return u.protocol==='https:'?u.href:'';path=u.pathname+u.search;}catch(_){return '';}
    }
    let route=path.startsWith(prefix+'/')?path.slice(prefix.length):path;
    route=route.startsWith('/')?route:'/'+route;
    if(!/^\/(FranchiseExplorer\/Artwork\/|Items\/)/i.test(route))return '';
    const key=serverPath(route);
    if(!blobCache.has(key)){
      const load=fetch(key,{headers:authHeaders()}).then(r=>{if(!r.ok)throw new Error('no image');return r.blob();})
        .then(blob=>blob.type.startsWith('image/')?URL.createObjectURL(blob):'').catch(()=>'');
      blobCache.set(key,load);
    }
    return await blobCache.get(key);
  }
  function imagePath(item,type){
    if(!item||!safeGuid(item.Id))return '';
    // Tagged URLs are cacheable by the browser (Jellyfin sends long-lived
    // cache headers for them), so revisiting a franchise reuses its artwork.
    const tagged=tag=>/^[a-z\d]+$/i.test(tag||'')?'&tag='+tag:'';
    if(type==='Backdrop' && item.BackdropImageTags && item.BackdropImageTags.length)return '/Items/'+item.Id+'/Images/Backdrop/0?maxWidth=1100'+tagged(item.BackdropImageTags[0]);
    const tags=item.ImageTags||{};
    if(!tags[type])return '';
    return '/Items/'+item.Id+'/Images/'+type+'?maxWidth='+(type==='Primary'?'420':'1100')+tagged(tags[type]);
  }
  function nodeById(id){return catalog.nodes.find(n=>n.id===id)||null;}
  function parents(node){const seen=new Set(), result=[];while(node&&!seen.has(node.id)){seen.add(node.id);result.unshift(node);node=nodeById(node.parentId);}return result;}
  function children(id){return catalog.nodes.filter(n=>(n.parentId||'')===(id||''));}
  function links(id){return catalog.links.filter(l=>l.nodeId===id);}
  function countDescendants(id,visited=new Set()){if(visited.has(id))return 0;visited.add(id);return links(id).length+children(id).reduce((t,n)=>t+countDescendants(n.id,visited),0);}
  function compare(a,b){if($('sort').value==='alpha')return String(a.name||a.title||'').localeCompare(String(b.name||b.title||''));return (+a.sortOrder||+a.position||0)-(+b.sortOrder||+b.position||0)||String(a.name||a.title||'').localeCompare(String(b.name||b.title||''));}
  function hashGroup(){const params=new URLSearchParams(location.hash.replace(/^#/,''));const id=params.get('group')||'';return safeGuid(id)&&nodeById(id)?id:'';}
  function openGroup(id){$('sort').value='custom';location.hash=id?'group='+encodeURIComponent(id):'';if(!id && !location.hash){current='';void render();}}
  function fallbackCover(kind){const box=document.createElement('span');box.className='fallback';const icon=text(document.createElement('span'),kind==='TV Show'?'▣':kind==='Movie'?'▶':'✦');icon.className='fallback-icon';box.append(icon,text(document.createElement('span'),kind));return box;}
  function mediaRange(l){const mode=l.rangeMode||'Full';if(mode==='Seasons')return 'Seasons '+l.startSeason+'–'+l.endSeason;
    if(mode==='Episodes')return 'S'+l.startSeason+'E'+l.startEpisode+' – S'+l.endSeason+'E'+l.endEpisode;return '';
  }
  function makeTile(title, subtitle, tag, onClick, kind){
    // Separate focusable card and info control: nested buttons are invalid HTML.
    const button=document.createElement('div');button.className='tile';
    button.setAttribute('role','button');button.tabIndex=0;
    button.addEventListener('click',e=>{if(!e.target.closest('.tile-info'))onClick();});
    button.addEventListener('keydown',e=>{if(e.target===button&&(e.key==='Enter'||e.key===' ')){e.preventDefault();onClick();}});
    button.setAttribute('aria-label',title+(subtitle?' — '+subtitle:''));
    const cover=document.createElement('span');cover.className='cover';const placeholder=fallbackCover(kind);cover.append(placeholder);
    if(tag){const badge=document.createElement('span');badge.className='tag';text(badge,tag);cover.append(badge);}
    const labels=document.createElement('span');labels.append(text(document.createElement('strong'),title),text(document.createElement('small'),subtitle||''));
    button.append(cover,labels);
    return {button,cover,placeholder};
  }
  function addImageToTile(tile, source){
    if(!source)return;
    const img=document.createElement('img');img.loading='lazy';img.alt='';img.addEventListener('error',()=>img.remove());img.addEventListener('load',()=>tile.placeholder.remove());img.src=source;
    tile.cover.prepend(img);
  }
  async function nodeArtwork(n, kind, seen=new Set()){
    if(!n||seen.has(n.id))return '';seen.add(n.id);
    const own=(n.artwork||{})[imageKeys[kind]]||'';
    const custom=await secureImage(own);if(custom)return custom;
    if(safeGuid(n.collectionId)){
      const collection=await getItem(n.collectionId);
      const inherited=await secureImage(imagePath(collection,kind));if(inherited)return inherited;
    }
    if(n.parentId){const parentArt=await nodeArtwork(nodeById(n.parentId),kind,seen);if(parentArt)return parentArt;}
    for(const link of links(n.id).slice(0,5)){
      const item=await getItem(link.itemId);
      const art=await secureImage(imagePath(item,kind));if(art)return art;
    }
    return '';
  }
  function openJellyfinItem(item,autoPlay=false){
    // Use the authenticated Jellyfin Web client, not a raw video URL; it owns
    // codec negotiation, transcoding, resume, and accessibility settings.
    // The optional Jellyfin Web integration recognizes feAutoPlay=1 and
    // activates the native player's Play button. Without it this falls back
    // gracefully to the real item's detail page.
    // Browse is a separate page from Jellyfin Web; its native shortcuts
    // handler is available only after switching to the authenticated Web UI.
    // Pass a short-lived, same-tab quick-play request for the injected bridge.
    // Information buttons intentionally keep using the ordinary details page.
    if(autoPlay && ['Movie','Episode'].includes(item.Type)){
      try{
        sessionStorage.setItem('fe-quickplay-v1',JSON.stringify({version:1,id:item.Id,
          created:Date.now(),positionTicks:0,startOver:true,type:item.Type,
          returnUrl:location.href,
          subtitleEnabled:localStorage.getItem(playbackPreferenceKey())==='1'}));
        location.href=serverPath('/web/#/home');
        return;
      }catch(error){console.warn('Franchise Explorer: quick-play handoff is unavailable',error);}
    }
    const sid=serverId?'&serverId='+encodeURIComponent(serverId):'';
    const playable=autoPlay?'&feAutoPlay=1&feSubs='+(localStorage.getItem(playbackPreferenceKey())==='1'?'1':'0'):'';
    location.href=serverPath('/web/#/details?id='+encodeURIComponent(item.Id)+sid+playable);
  }
  function playbackPreferenceKey(){return 'fe-subtitles:'+serverId+':'+userId;}
  function pauseTimelineForIndependentPlayback(){
    if(!timeline)return Promise.resolve();
    const active=[...timeline.states.values()].filter(x=>x.playbackMode==='playing');
    return Promise.all(active.map(x=>timeline.save({...x,playbackMode:'paused',sessionId:''}))).then(()=>{});
  }
  async function playMediaItem(item,ref){
    if(!item)return;
    try{
      let target=item;
      if(item.Type==='Series'){
        if(!timeline)throw Error('The TV Show episode resolver is unavailable.');
        const episodes=await timeline.getEpisodes(item.Id);
        const eligible=episodes.filter(ep=>window.FranchiseTimeline.inRange(ep,ref||{rangeMode:'Full'}));
        if(!eligible.length)throw Error('No playable episodes found for the selected season/episode range.');
        target=eligible[0];
      }
      if(!['Movie','Episode'].includes(target.Type)){
        openJellyfinItem(item,false);return;
      }
      // A card click is an independent playback request, not a chronological
      // Play Now operation. The timeline queue must remain at its saved cursor.
      await pauseTimelineForIndependentPlayback();
      sessionStorage.setItem('fe-return-group',current||'');
      sessionStorage.setItem('fe-return-scroll',String(window.scrollY||0));
      openJellyfinItem(target,true);
    }catch(err){status('Unable to start playback: '+err.message);}
  }
  async function showMedia(l, grid, ticket, filter='', row=null){
    const item=await getItem(l.itemId);
    if(ticket!==renderSerial||!item||filter&&!String(item.Name||'').toLocaleLowerCase().includes(filter))return false;
    const range=mediaRange(l);
    const type=item.Type==='Series'?'TV Show':(item.Type==='BoxSet'?'Collection':(item.Type==='Movie'?'Movie':item.Type||'Video'));
    const tile=makeTile(item.Name||'Untitled', [type,item.ProductionYear||'',range].filter(Boolean).join(' · '),range||type,()=>void playMediaItem(item,l),type);
    const info=document.createElement('button');info.className='tile-info';info.type='button';
    info.textContent='ⓘ';info.title='Information about '+(item.Name||'this title');
    info.setAttribute('aria-label','Information about '+(item.Name||'this title'));
    info.addEventListener('click',event=>{event.stopPropagation();
      sessionStorage.setItem('fe-return-group',current||'');
      sessionStorage.setItem('fe-return-scroll',String(window.scrollY||0));
      openJellyfinItem(item,false);
    });
    tile.cover.append(info);
    if(timeline)timeline.decorateMedia(tile,l,row,item);
    void secureImage(imagePath(item,'Primary')).then(url=>{if(ticket===renderSerial)addImageToTile(tile,url);});
    return tile;
  }
  async function showNode(n,grid,ticket){
    const counts=mediaCounts(n.id);
    const subtitle='TV Shows '+counts.tvShows+' · Movies '+counts.movies;
    const tile=makeTile(n.name||'Unnamed group',subtitle,n.nodeType==='Franchise'?'':n.nodeType,()=>openGroup(n.id),'Group');
    grid.append(tile.button);shownCards.push(tile.button);
    void nodeArtwork(n,'Primary').then(url=>{if(ticket===renderSerial)addImageToTile(tile,url);});
  }
  function drawBreadcrumbs(node){
    $('breadcrumbs').replaceChildren();const path=parents(node);
    const home=document.createElement('button');text(home,catalog.title||'Franchises');home.addEventListener('click',()=>openGroup(''));$('breadcrumbs').append(home);
    for(const n of path){const sep=text(document.createElement('span'),'›');sep.setAttribute('aria-hidden','true');$('breadcrumbs').append(sep);
      const crumb=document.createElement('button');crumb.textContent=n.name;crumb.className=n.id===current?'current':'';crumb.addEventListener('click',()=>openGroup(n.id));$('breadcrumbs').append(crumb);}
  }
  function nestedLinks(root){
    const ids=new Set([root]);let changed=true;
    while(changed){changed=false;for(const n of catalog.nodes){if(ids.has(n.parentId)&&!ids.has(n.id)){ids.add(n.id);changed=true;}}}
    return catalog.links.filter(l=>ids.has(l.nodeId));
  }
  function mediaCounts(root){
    const ids=new Set([root]);let changed=true;
    while(changed){changed=false;for(const n of catalog.nodes){if(ids.has(n.parentId)&&!ids.has(n.id)){ids.add(n.id);changed=true;}}}
    const items=[...catalog.links.filter(l=>ids.has(l.nodeId)),
      ...(catalog.rows||[]).filter(r=>ids.has(r.parentNodeId)).flatMap(r=>r.items||[])];
    // One title may appear in several rows or episode ranges. Count the
    // distinct Jellyfin titles once, without counting collection containers.
    const seen=new Set();let tvShows=0,movies=0;
    for(const item of items){
      const id=String(item.itemId||'').toLowerCase();
      if(!id||seen.has(id))continue;
      const kind=String(item.itemType||'').toLowerCase();
      if(kind==='series'||kind==='tv show'){tvShows++;seen.add(id);}
      else if(kind==='movie'){movies++;seen.add(id);}
    }
    return {tvShows,movies};
  }
  function defaultRows(id, groups, directMedia){
    // Backward compatible: v0.7.2 franchises appear in rows without changing
    // their saved groups or requiring an admin migration.
    const specs=[['Eras',['Era']],['Phases',['Phase']],['Sagas',['Saga']],['Collections',['Collection','Character']]];
    const rows=[],used=new Set();
    for(const [name,types] of specs){const nodeIds=groups.filter(n=>types.includes(n.nodeType)).map(n=>n.id);
      if(nodeIds.length){rows.push({id:'suggested-'+name,name,rowType:'Groups',nodeIds,mediaLinkIds:[]});nodeIds.forEach(x=>used.add(x));}}
    const rest=groups.filter(n=>!used.has(n.id)).map(n=>n.id);
    if(rest.length)rows.push({id:'suggested-other',name:'Other Groups',rowType:'Groups',nodeIds:rest,mediaLinkIds:[]});
    if(directMedia.length)rows.push({id:'suggested-media',name:'Movies & TV Shows',rowType:'Media',nodeIds:[],mediaLinkIds:directMedia.map(l=>l.id||l.itemId)});
    return rows.map(row=>({...row,parentNodeId:id}));
  }
  function rowIsMedia(r){return ['Media','Timeline','Mixed'].includes(r.rowType);}
  function rowIsGroups(r){return ['Groups','Mixed'].includes(r.rowType);}
  // Catalog media links are keyed by plugin link ID. Older catalogs did not
  // expose it; create a unique in-memory fallback for their read-only view.
  function findLink(key){return catalog.links.find(l=>l.id===key)||null;}
  function shelfElement(r){
    const shelf=document.createElement('section');shelf.className='shelf'+(view==='list'?' shelf-list':'');shelf.setAttribute('aria-label',r.name);
    const header=document.createElement('div');header.className='shelf-header';
    const heading=document.createElement('h2');heading.textContent=r.name;
    const tools=document.createElement('div');tools.className='shelf-tools';
    const count=document.createElement('span');count.className='shelf-count';count.textContent='';
    const prev=document.createElement('button');prev.type='button';prev.className='shelf-arrow';prev.textContent='‹';prev.setAttribute('aria-label','Scroll '+r.name+' left');
    const next=document.createElement('button');next.type='button';next.className='shelf-arrow';next.textContent='›';next.setAttribute('aria-label','Scroll '+r.name+' right');
    const track=document.createElement('div');track.className='shelf-track';track.setAttribute('role','region');track.setAttribute('aria-label',r.name+' titles');
    prev.addEventListener('click',()=>track.scrollBy({left:-Math.max(track.clientWidth*.85,190),behavior:'smooth'}));
    next.addEventListener('click',()=>track.scrollBy({left:Math.max(track.clientWidth*.85,190),behavior:'smooth'}));
    tools.append(count,prev,next);header.append(heading,tools);shelf.append(header,track);
    return {shelf,count,track};
  }
  async function renderShelf(r,ticket,filter){
    if(ticket!==renderSerial)return 0;
    const frame=shelfElement(r),root=$('rows-container');root.append(frame.shelf);
    if(timeline) timeline.addControls(r,frame);
    const siblings=children(current);
    const possibleLinks=nestedLinks(current),possibleIds=new Set(possibleLinks.map(l=>l.id));
    const rowGroups=rowIsGroups(r)?(r.nodeIds||[]).map(id=>siblings.find(n=>n.id===id)).filter(Boolean):[];
    // Existing row membership is retained. Direct entries are independently
    // selected from the user's whole Jellyfin library, not from franchise links.
    const inherited=rowIsMedia(r)?(r.mediaLinkIds||[]).map(findLink).filter(l=>l&&possibleIds.has(l.id)):[];
    const own=rowIsMedia(r)?(r.items||[]).filter(l=>safeGuid(l.itemId)):[];
    const combined=[...inherited,...own];
    const order=Array.isArray(r.mediaOrder)?r.mediaOrder:[];
    const mediaRank=new Map(order.map((id,i)=>[id,i]));
    const rowMedia=order.length?[...combined].sort((a,b)=>(mediaRank.get(a.id)??99999)-(mediaRank.get(b.id)??99999) || (combined.indexOf(a)-combined.indexOf(b))):combined;
    const groupMatches=rowGroups.filter(n=>!filter||n.name.toLocaleLowerCase().includes(filter));
    const orderedGroups=$('sort').value==='alpha'?groupMatches.sort(compare):groupMatches;
    for(const n of orderedGroups)void showNode(n,frame.track,ticket);
    let seen=orderedGroups.length;
    const media=$('sort').value==='alpha'?[...rowMedia].sort(compare):rowMedia;
    for(let i=0;i<media.length;i+=6){
      const batch=await Promise.all(media.slice(i,i+6).map(l=>showMedia(l,frame.track,ticket,filter,r)));
      if(ticket!==renderSerial)return 0;
      // Batch fetches can resolve in any order. Append synchronously in the
      // original row order, not network completion order (the back-button bug).
      for(const tile of batch){if(!tile)continue;frame.track.append(tile.button);shownCards.push(tile.button);seen++;}
    }
    if(!seen){const p=document.createElement('div');p.className='shelf-empty';p.textContent=(r.rowType==='Timeline'?'No titles assigned to this viewing order yet.':'No matching items in this row.');frame.track.append(p);}
    frame.count.textContent=seen+' item'+(seen===1?'':'s');
    return seen;
  }
  async function render(){
    const ticket=++renderSerial;current=hashGroup();shownCards=[];if(timeline)timeline.decorations=[];
    const selected=nodeById(current),title=selected?selected.name:(catalog.title||'Franchises');
    text($('brand-title'),'Franchise Explorer');document.title=title+' · Franchise Explorer';drawBreadcrumbs(selected);
    // The root is the library itself: show actual franchise posters immediately.
    // Keep the rich artwork hero for a selected franchise only.
    document.querySelector('.hero').classList.toggle('hidden',!selected);
    $('breadcrumbs').classList.toggle('hidden',!selected);
    $('browse-back').disabled=!selected;$('browse-back').onclick=()=>openGroup(selected?selected.parentId:'');
    text($('hero-type'),selected?selected.nodeType:'Virtual library');text($('hero-title'),title);
    text($('hero-description'),selected?(selected.overview||'Browse the subgroups, movies, and TV shows linked to this virtual franchise.'):'Browse your franchise groups, eras, phases, and viewing references.');
    if(selected){const counts=mediaCounts(selected.id);text($('hero-count'),'TV Shows '+counts.tvShows+' · Movies '+counts.movies);}
    else text($('hero-count'),catalog.nodes.filter(x=>!x.parentId).length+' top-level franchises');
    $('hero-poster-wrap').classList.add('hidden');$('hero-backdrop').classList.add('hidden');
    if(selected){
      void nodeArtwork(selected,'Primary').then(url=>{if(ticket===renderSerial&&url){$('hero-poster').src=url;$('hero-poster-wrap').classList.remove('hidden');}});
      void nodeArtwork(selected,'Backdrop').then(url=>{if(ticket===renderSerial&&url){$('hero-backdrop').src=url;$('hero-backdrop').classList.remove('hidden');}});
    }
    const groupList=children(current).sort(compare),mediaList=current?links(current).sort(compare):[];
    const filter=$('search').value.trim().toLocaleLowerCase();
    $('rows-container').replaceChildren();$('group-grid').replaceChildren();$('media-grid').replaceChildren();
    $('group-grid').classList.toggle('listview',view==='list');$('media-grid').classList.toggle('listview',view==='list');
    text($('items-heading'),selected?'Browse '+selected.name:'Your franchises');
    $('groups-section').classList.add('hidden');$('media-section').classList.add('hidden');
    status('');let shown=0;
    if(selected){
      const explicit=(catalog.rows||[]).filter(r=>r.parentNodeId===selected.id).sort((a,b)=>a.sortOrder-b.sortOrder||a.name.localeCompare(b.name));
      let rows=explicit.length?explicit:defaultRows(selected.id,groupList,mediaList);
      if(explicit.length){
        const usedGroups=new Set(rows.filter(rowIsGroups).flatMap(r=>r.nodeIds||[]));
        const usedMedia=new Set(rows.filter(rowIsMedia).flatMap(r=>r.mediaLinkIds||[]));
        const leftoverGroups=groupList.filter(n=>!usedGroups.has(n.id)).map(n=>n.id);
        const leftoverMedia=mediaList.filter(l=>!usedMedia.has(l.id)).map(l=>l.id);
        if(leftoverGroups.length)rows=[...rows,{id:'fallback-groups',parentNodeId:current,name:'Unassigned Groups',rowType:'Groups',nodeIds:leftoverGroups,mediaLinkIds:[]}];
        if(leftoverMedia.length)rows=[...rows,{id:'fallback-media',parentNodeId:current,name:'Unassigned Movies & TV Shows',rowType:'Media',nodeIds:[],mediaLinkIds:leftoverMedia}];
      }
      for(const r of rows){shown+=await renderShelf(r,ticket,filter);if(ticket!==renderSerial)return;}
    }else{
      const visible=groupList.filter(n=>!filter||n.name.toLocaleLowerCase().includes(filter));
      $('groups-section').classList.toggle('hidden',!visible.length);
      for(const n of visible)void showNode(n,$('group-grid'),ticket);
      shown=visible.length;
    }
    if(ticket!==renderSerial)return;
    $('empty').classList.toggle('hidden',shown>0);
    status('');
    // On return from Jellyfin details/player, restore the same group and
    // scroll location after the media cards have actually been rendered.
    if(sessionStorage.getItem('fe-return-group')===(current||'') && sessionStorage.getItem('fe-return-scroll')!==null){
      const value=Number(sessionStorage.getItem('fe-return-scroll'))||0;
      sessionStorage.removeItem('fe-return-group');sessionStorage.removeItem('fe-return-scroll');
      requestAnimationFrame(()=>window.scrollTo(0,value));
    }
  }
  $('browse-back').onclick=()=>{const n=nodeById(current);openGroup(n?n.parentId:'');};
  $('brand-home').addEventListener('click',event=>{
    event.preventDefault();
    $('search').value='';$('sort').value='custom';
    window.scrollTo({top:0,behavior:'instant'});
    openGroup('');
  });
  $('toggle-view').addEventListener('click',()=>{view=view==='grid'?'list':'grid';$('toggle-view').setAttribute('aria-pressed',String(view==='list'));text($('toggle-view'),view==='list'?'▦ Grid':'☷ List');void render();});
  $('sort').addEventListener('change',()=>void render());
  $('search').addEventListener('input',()=>void render());
  window.addEventListener('hashchange',()=>{window.scrollTo({top:0,behavior:'instant'});$('search').value='';$('sort').value='custom';void render();});
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&current){event.preventDefault();const n=nodeById(current);openGroup(n?n.parentId:'');return;}
    if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)||/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))return;
    const cards=shownCards.filter(el=>el.offsetParent!==null);const focusIndex=cards.indexOf(document.activeElement);
    if(focusIndex<0)return;
    const width=cards[focusIndex].getBoundingClientRect().width;
    const columns=view==='list'?1:Math.max(1,Math.round(($('group-grid').clientWidth||$('media-grid').clientWidth||width)/Math.max(width,1)));
    const delta=event.key==='ArrowLeft'?-1:event.key==='ArrowRight'?1:event.key==='ArrowUp'?-columns:columns;
    const target=cards[focusIndex+delta];if(target){event.preventDefault();target.focus();}
  });
  async function init(){
    $('sort').value='custom';
    if(!(await session())){status('Sign in to Jellyfin Web on this device first, then return to Franchises.');$('empty').classList.remove('hidden');text($('empty'),'No Jellyfin Web login session was found for this server.');return;}
    try{
      catalog=await api('/FranchiseExplorer/Catalog');
      if(!Array.isArray(catalog.nodes)||!Array.isArray(catalog.links))throw new Error('Unexpected catalog format.');
      // Ensure identifiers are structurally safe before constructing any URL.
      catalog.nodes=catalog.nodes.filter(n=>safeGuid(n.id));
      catalog.links=catalog.links.filter(l=>safeGuid(l.nodeId)&&safeGuid(l.itemId)).map((l,i)=>({...l,id:safeGuid(l.id)?l.id:'legacy-'+i}));
      catalog.rows=Array.isArray(catalog.rows)?catalog.rows.filter(r=>safeGuid(r.id)&&safeGuid(r.parentNodeId)):[];
      if(window.FranchiseTimeline){timeline=new window.FranchiseTimeline.TimelineManager({catalog,prefix,token,userId,serverId,getItem});await timeline.load();}
      void render();
      const requested=new URLSearchParams(location.search).get('timeline');
      if(timeline && requested){const row=catalog.rows.find(r=>r.id===requested&&r.rowType==='Timeline');if(row){const params=new URLSearchParams(location.search);const action=['restart-history','restart-current','select'].includes(params.get('action'))?params.get('action'):'';const resume=params.get('resume')==='1';if(action){params.delete('action');history.replaceState(history.state,'',location.pathname+(params.size?'?'+params.toString():'')+location.hash);}openGroup(row.parentNodeId);setTimeout(()=>void timeline.openDialog(row,resume,action),450);}}
    }catch(error){status('Cannot load Franchises: '+error.message+'. Confirm the plugin is running and your Jellyfin session is active.');}
  }
  void init();
})();
</script>
</body>
</html>
